name: 🔥 maps.detsad.photo deploy

on:
  push:
    branches: [ master ]

concurrency: production_environment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🏁 Actions starts
        uses: actions/checkout@v3
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: 🚀 Deploy to host
        uses: deployphp/action@v1
        with:
          dep: --file=deploy.yaml test maps.detsad.photo
          private-key: ${{ secrets.PRIVATE_KEY }}
          verbosity: -vvv